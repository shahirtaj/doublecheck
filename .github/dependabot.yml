version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind 4 is a deliberate migration project for later: the PostCSS
      # plugin moved to @tailwindcss/postcss and config moves into CSS, and
      # the styles.ts cls atoms mean it touches every visual surface. An
      # official upgrade tool exists - revisit as its own project.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename, which eslint-config-next's
      # bundled eslint-plugin-react still calls - lint crashes outright.
      # Waits for eslint-config-next support, which arrives with a Next
      # upgrade - revisit then.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships the native compiler without the JS compiler API
      # (expected back in 7.1), and eslint-config-next's bundled
      # typescript-eslint throws on load without it - lint crashes
      # outright. tsc --noEmit, vitest, and next build (from Next 16.3)
      # all pass, so lint is the only blocker. Waits for a TS 7-capable
      # typescript-eslint to reach eslint-config-next - revisit when its
      # typescript-eslint dependency admits typescript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
