name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: every step only reads the repo.
# Without this the token inherits the repository default, which can include
# write scopes none of these steps need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 for its bundled npm >= 11.11.0: the lockfile is maintained in
      # the npm 11 shape (libc fields kept, unsatisfied optional peers pruned)
      # by Dependabot's npm 11.17.0, and npm 10 (bundled with Node 22, never
      # updated past it) hard-fails `npm ci` against that shape. Node 24 also
      # matches the Vercel build image.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
